[versions]
java = "25"
# JUnit 5.14.x rather than 6.x: jqwik 1.10 is built against JUnit Platform 1.14.
junit = "5.14.4"
assertj = "3.27.7"
jqwik = "1.10.2"
jmh = "1.37"
google-java-format = "2.0.0"
spotless = "8.11.0"
champeau-jmh = "0.7.4"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
jmh = { id = "me.champeau.jmh", version.ref = "champeau-jmh" }
